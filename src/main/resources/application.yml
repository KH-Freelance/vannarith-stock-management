server:
  port: 8080
spring:
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jpa:
    jdbc:
      time_zone: UTC
      batch_size: 1000
    open-in-view: true
    show-sql: true
cloudinary: 
  url: ${CLOUDINARY_URL:cloudinary://878231315371161:_v9bFowIqhd8RQ1bw1LKtoFkmtM@dohtq6cbz}
  default-image: https://res.cloudinary.com/dohtq6cbz/image/upload/v1731051235/empty_mjkuxf.jpg
postgress-connection:
  # jdbc-url: jdbc:postgresql://${DB_HOST:localhost}:5432/stock-new
  jdbc-url: jdbc:postgresql://${DB_HOST:ec2-3-17-133-210.us-east-2.compute.amazonaws.com}:5432/stockmanagement
  driver-class-name: org.postgresql.Driver
  username: ${DB_USER:admin}
  password: ${DB_PASS:admin}
  maximum-pool-size: 10
  connection-timeout: 50000
  idle-timeout: 30000
  minimum-idle: 30000
  max-lifetime: 30000
